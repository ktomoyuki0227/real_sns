services:
  - type: web
    name: real-sns-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGOURL
        sync: false   # Renderダッシュボードで設定（MongoDB Atlas接続文字列）
      - key: FRONTEND_URL
        sync: false   # Renderダッシュボードで設定（VercelのURL）
      - key: NODE_ENV
        value: production
